# One-click deploy on Render's free plan: https://render.com/deploy
# Note: the free plan has no persistent disk, so the SQLite file resets when the service redeploys.
services:
  - type: web
    name: notevault-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.14.0"
      - key: JWT_SECRET
        generateValue: true
